plugins {
    id "com.android.application"
}

// one place for the version, shared with the web builds
def ver = new Properties()
file("../version.properties").withInputStream { ver.load(it) }
def gamesAppId = (project.findProperty("skyrath.gamesAppId") ?: "").toString().trim()
// AdMob: your app ID and rewarded ad unit ID (android/gradle.properties). Until they are set, Google's test IDs are used
// (ads show as "Test Ad" and earn nothing).
def admobAppId = (project.findProperty("skyrath.admobAppId") ?: "").toString().trim() ?: "ca-app-pub-3940256099942544~3347511713"
def admobRewardedId = (project.findProperty("skyrath.admobRewardedId") ?: "").toString().trim() ?: "ca-app-pub-3940256099942544/5224354917"

android {
    namespace "com.skyrath.game"
    compileSdk 36

    defaultConfig {
        applicationId "com.devilexxon.skyrath"        // the Google Play app (cloud save through Google Play Games)
        minSdk 24
        targetSdk 36
        versionCode ver.getProperty("versionCode").trim().toInteger()
        versionName ver.getProperty("versionName").trim()
        resValue "string", "game_services_project_id", gamesAppId
        resValue "string", "admob_app_id", admobAppId
        resValue "string", "admob_rewarded_id", admobRewardedId
    }

    buildTypes {
        release {
            minifyEnabled false    // the bundle is signed afterwards with your private upload key (tools/android_key.ps1 sign)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // the game files are copied here by tools/build_android.sh (not committed)
    sourceSets {
        main.assets.srcDirs = ["build/game-assets"]
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-games-v2:22.1.0"
    implementation "com.google.android.gms:play-services-ads:25.5.0"
}
