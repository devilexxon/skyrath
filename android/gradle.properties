org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Google Play Games project ID (a long number from Play Console -> Play Games Services -> Configuration).
# Leave empty until Play Games Services is set up; cloud save then stays off.
skyrath.gamesAppId=
# AdMob (Google Play version): app ID (ca-app-pub-...~...) and rewarded ad unit ID (ca-app-pub-.../...).
# Leave empty to use Google's test ads.
skyrath.admobAppId=
skyrath.admobRewardedId=
